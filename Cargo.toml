[package]
name = "api"
version = "0.1.4"
edition = "2021"
authors = ["Federico Fusco <me@federicofusco.dev>"]

[dependencies]
actix-web = "4"
actix-service = "2.0.2"
actix-identity = "0.7.1"
futures = "0.3.30"
dotenvy = "0.15"
r2d2 = "0.8.10"
oauth2 = "4.4.2"
reqwest = "*"
serde_json = "1"
thiserror = "1.0.63"
strum_macros = "0.26"

[dependencies.actix-session]
version = "0.9.0"
features = ["cookie-session"]

[dependencies.strum]
version = "0.26"
features = ["derive"]

[dependencies.auth]
version = "0.1.4"
path = "../auth"

[dependencies.serde]
version = "1"
features = ["derive"]

[dependencies.diesel]
version = "2.2.0"
features = ["postgres", "uuid", "r2d2", "chrono"]

[dependencies.uuid]
version = "1.10.0"
features = ["v4", "fast-rng", "serde"] 